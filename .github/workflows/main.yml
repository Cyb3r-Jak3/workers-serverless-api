name: Deploy

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - 'package.json'
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: ['package.json', '**/pnpm-lock.yaml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          version: 11
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: ${{github.ref_type == 'branch'}}
        run: pnpm run test:lint

      - name: Test
        if: ${{github.ref_type == 'branch'}}
        run: pnpm run test:unit

      - name: Report Variables
        run: |
          echo "GitHash=${{ github.sha }}" >> $GITHUB_ENV
          echo "BuiltTime=$(git show -s --format=%ci ${GITHUB_SHA::8})" >> $GITHUB_ENV

      - name: Deploy to Cloudflare with Wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          command: deploy --env production
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: 4.156.0
          environment: production
          secrets: |
            GitHash
            BuiltTime
        env:
          GitHash: ${{ env.GitHash }}
          BuiltTime: ${{ env.BuiltTime }}
